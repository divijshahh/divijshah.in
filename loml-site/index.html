<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2150">
<meta name="robots" content="noindex, nofollow">
<title>For Ishita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Shantell+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d2340;--night:#2a2150;--plum:#4b2f6b;--lamp:#ffd36a;--blush:#ffb3c1;--berry:#e2456b;--ui:"Fredoka",system-ui,sans-serif;--hand:"Shantell Sans","Comic Sans MS",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font:500 17px/1.4 var(--ui)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
:focus-visible{outline:3px solid var(--lamp);outline-offset:3px;border-radius:10px}
.screen{position:fixed;inset:0;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .5s,transform .55s,visibility 0s .55s;overflow:hidden}
.screen.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .5s,transform .55s}
.room{transform:scale(.35)}.room.on{transform:none}
.sky{background:linear-gradient(#241a4d,#4b2f6b 48%,#e2708f 80%,#ffb184)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes drift{to{transform:translateX(120vw)}}
@keyframes rise{to{transform:translateY(-90px) scale(1.3);opacity:0}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes hop{50%{transform:translateY(-14px)}}
/* exterior */
.cloud{position:absolute;width:90px;opacity:.85;left:-120px;animation:drift 70s linear infinite}
.moon{position:absolute;right:9%;top:8%;width:clamp(60px,12vmin,110px);animation:bob 6s infinite ease-in-out}
.hill{position:absolute;left:-10%;right:-10%;bottom:0;height:24%;background:#3f9e83;border-radius:50% 50% 0 0/35% 35% 0 0}
.hill.b{height:30%;background:#2f7f6d;left:-30%;right:20%}
.greet{position:absolute;left:0;right:0;top:7%;text-align:center;color:#fff;padding:0 20px;z-index:3}
.greet h1{margin:0;font-weight:600;font-size:clamp(2.2rem,8vmin,4rem)}
.greet p{margin:.3em 0 0;font:400 clamp(1rem,2.6vmin,1.3rem)/1.3 var(--hand);color:#ffe9f0}
.house{position:absolute;left:50%;bottom:13%;width:min(96vw,66vh,600px);aspect-ratio:1.05;transform:translateX(-50%)}
.h-body{position:absolute;left:5%;right:5%;bottom:0;height:60%;background:#ffc9b3;box-shadow:inset -14px 0 #f6b39a}
.h-roof{position:absolute;left:-3%;right:-3%;bottom:58%;height:46%;background:#e2456b;clip-path:polygon(50% 0,100% 100%,0 100%)}
.h-chim{position:absolute;right:20%;bottom:70%;width:9%;height:22%;background:#b9375a}
.smoke{position:absolute;right:21%;bottom:90%;width:7%;aspect-ratio:1;border-radius:50%;background:#ffffffaa;animation:rise 4s infinite}
.h-win{position:absolute;width:19%;bottom:26%;filter:drop-shadow(0 0 18px #ffd36a)}
.h-win:before{content:"";position:absolute;inset:8%;background:#ffd36a;z-index:-1;animation:pulse 3s infinite}
.h-door{position:absolute;left:50%;bottom:0;width:38%;transform:translateX(-50%);z-index:2;perspective:600px}
.h-door img:not(.keys){width:100%}.h-door img{transform-origin:left center;transition:transform .9s ease-in}
.h-door.open img{transform:rotateY(-75deg)}
.h-door:before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff6c4;transform:translate(-50%,-50%);transition:transform 1.1s ease-in;z-index:-1}
.h-door.open:before{transform:translate(-50%,-50%) scale(260)}
.ring{position:absolute;inset:-6% -4%;border:3px dashed #fff;border-radius:50% 50% 8px 8px;opacity:.8;animation:pulse 1.6s infinite}
.keys{position:absolute;right:-30%;top:34%;width:30%;transform-origin:top center;animation:sway 2.4s infinite}
.plant{position:absolute;bottom:-2%}
.fly{position:absolute;width:34px;animation:bob 2.2s infinite}
/* hub */
.bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;z-index:6;color:#fff}
.bar h2{margin:0;font-weight:600;font-size:1.15rem;text-align:center;flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:#ffffff26;border-radius:99px;padding:8px 14px;color:#fff;backdrop-filter:blur(6px);min-height:40px}
.pill:hover{background:#ffffff40}
.pill img{width:22px}.bar.lt{color:var(--ink)}.bar.lt .pill{color:var(--ink);background:#0000001a}
.meter{display:flex;gap:3px}
.meter i{width:9px;height:9px;border-radius:50%;background:#ffffff40}.meter i.f{background:var(--blush)}
.cut{position:absolute;left:50%;top:60px;bottom:82px;width:min(94vw,860px);transform:translateX(-50%);display:flex;flex-direction:column}
.roof{height:clamp(64px,13vh,110px);margin:0 -2%;background:#e2456b;clip-path:polygon(50% 0,100% 100%,0 100%);position:relative;flex:none}
.attic{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:clamp(54px,9vh,76px);height:clamp(40px,7vh,58px);background:#ffd36a;border:4px solid #b9375a;border-radius:10px 10px 0 0;display:grid;place-items:center}
.attic img{width:70%}
.attic.ready{animation:pulse 1.4s infinite;box-shadow:0 0 28px #ffd36a}
.floors{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:5px;padding:5px;background:#5b3b6e;border-radius:0 0 14px 14px}
@media(min-aspect-ratio:1/1){.floors{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}}
.cell{position:relative;border-radius:10px;overflow:hidden;text-align:center;filter:saturate(.55) brightness(.78);transition:filter .5s,transform .2s;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:6px}
.cell.seen{filter:none}.cell:hover{transform:translateY(-3px)}
.cell .pv{position:absolute;inset:10% 0 36%;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.cell .pv img{height:100%;max-height:78px;width:auto;animation:bob 4s infinite ease-in-out}.cell .pv img:nth-child(2){animation-delay:-2s}
.cell b{position:relative;font-weight:600;font-size:.95rem}
.cell .meter{position:relative;margin-top:3px}.cell .meter i{background:#0000002e}.cell .meter i.f{background:var(--berry)}
.sprite{position:absolute;width:46px;z-index:5;pointer-events:none;transition:left .7s ease-in-out,top .7s ease-in-out;transform:translate(-50%,-100%)}
.sprite img{animation:hop .7s 2}
.jar{position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:8;width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 6px 18px #0004;display:grid;place-items:center}
.jar img{width:40px}.jar:hover{animation:pulse .6s}
/* rooms */
.area{position:absolute;inset:0;top:0}
.stage{position:absolute;top:56px;bottom:0;left:50%;width:min(100%,1100px);transform:translateX(-50%);container-type:size}
@media(max-aspect-ratio:1/1){.o{--u:1.6cqmin}}
.o{position:absolute;left:var(--x);top:var(--y);width:calc(var(--s)*var(--u,1cqmin));transform:translate(-50%,-100%);transition:transform .2s}
button.o:hover{transform:translate(-50%,-100%) scale(1.07) rotate(-2deg)}
button.o:active{transform:translate(-50%,-100%) scale(.94)}
.o>img{width:100%;filter:drop-shadow(0 6px 5px #0003)}
.o.d{pointer-events:none;animation:bob 5s infinite ease-in-out}
.sp{position:absolute;right:-6%;top:-6%;width:calc(5*var(--u,1cqmin));animation:tw 1.4s infinite}
.shelf{position:absolute;height:10px;background:#a9714f;border-radius:4px;box-shadow:0 5px #7d4f37;transform:translate(-50%,0)}
.photo{background:#fff;padding:5% 5% 12%;box-shadow:0 6px 12px #0004;transform:translate(-50%,-100%) rotate(var(--r,-3deg))}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;filter:none}
.cork{background:#c89a68;border:6px solid #8d6240;border-radius:6px}
.note{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,160%);width:min(88vw,460px);z-index:9;background:#fff8d8;border-radius:6px 6px 16px 6px;padding:18px 22px 16px;box-shadow:0 12px 30px #0006;font:500 clamp(1.15rem,3.6vw,1.5rem)/1.35 var(--hand);color:var(--ink);transition:transform .45s cubic-bezier(.3,1.5,.5,1);rotate:-1deg}
.note.on{transform:translate(-50%,0)}
.note small{display:block;margin-top:8px;font:400 .8rem var(--ui);opacity:.55}
.note:before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:22px;background:#ffb3c188;transform:translateX(-50%) rotate(-2deg)}
.heart{position:fixed;width:26px;z-index:10;pointer-events:none;animation:rise 1.3s forwards}
.dark{position:absolute;inset:56px 0 0;background:#0a0620;opacity:0;pointer-events:none;transition:opacity .6s}
.dark.on{opacity:.72}
.modal{position:fixed;inset:0;z-index:20;background:#140f2ccc;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.polaroid{background:#fff;padding:14px 14px 46px;border-radius:4px;box-shadow:0 20px 50px #0008;transform:rotate(-2deg);max-width:min(92vw,560px)}
.polaroid img{max-height:70dvh;width:auto;margin:auto}
.x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px}
/* letter */
.paper{position:absolute;left:50%;top:70px;bottom:20px;width:min(92vw,620px);transform:translateX(-50%);overflow:auto;background:repeating-linear-gradient(#fff8d8 0 33px,#ecd9a8 34px);border-radius:8px;padding:22px clamp(18px,5vw,40px);font:500 clamp(1.1rem,3.4vw,1.4rem)/34px var(--hand);box-shadow:0 20px 50px #0006}
.paper p{margin:0 0 34px}.paper .sig{color:var(--berry);font-weight:600}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

<script>
(function(){

/* ---- content ---- */
var P="the photo";
var ROOMS=[
{id:"entry",name:"The entryway",wall:"#ffd7c0",floor:"#d99a78",pv:["door","handbag"],objs:[

{id:"balcony",name:"The balcony",wall:"linear-gradient(#1c1646,#46247a)",floor:"#4a2f4f",dark:1,pv:["microphone","crescent-moon"],objs:[

];

var NEED=Math.ceil(TOTAL*.7);
var POOL=["You make my weird feel normal.","You understand me at a level I didn’t know was possible.","I’ve never been this open with anyone else.","I can’t picture my life with anyone else.","I changed because I wanted to, and because of you.","You’re allowed to rest. I’ll cover for a while.","You’re smarter than your doubts.","I’m proud of how hard you work.","Our apartment will be a mess and I will love it.","We’re getting married. I’ve decided.","You were never a mistake. You’re the plan.","You make ordinary days the point.","I’m more myself around you than anywhere else.","The way you talk is the cutest part of my day.","You’re the first person I want to tell, every time.","I’m so glad I found someone as weird as me.","I’d text you out of nowhere again.","Whatever happens, I’m on your side.","I love you soooo so much, babe.","You’re easy to love.","I want you for life.","I’m going to keep trying. I mean it.","Every argument, I still pick us.","You’re my favourite person to be quiet with."];
var LETTER=["Ishita,","It’s late and I’m pretending to be asleep while I write this.","I texted you on Instagram out of nowhere. A few weeks later we were at a karaoke bar, and I was the guy working out how to get you home. Not the first date I would have picked.","I had decided the morning after would be a mistake. Somewhere along the way, a lot sooner than I expected, I completely fell for you.","I’ve never been this open or this affectionate with anyone. It doesn’t come naturally to me, and I’m learning it anyway, because I never want you to feel unloved because of my strange ways of showing it.","I’m so glad I found someone who shares my weirdness, and is probably weirder.","I want the ordinary future with you. An apartment. Coming home to you scrolling reels and ignoring the ones I sent three days ago.","I’ll love you the way you want to be loved, or I’ll die trying. I hope we never tire of our arguments, and only ever see them as the way we get better at each other.","I want you for life. We’re getting married.","I love you so much, babe.","Divij"];

try{found=JSON.parse(localStorage.getItem("f")||"{}");seen=JSON.parse(localStorage.getItem("s")||"{}")}catch(e){}

 var bar=el("div","bar");var pg=el("div","pill","<img src='"+I("sparkles")+"' alt=''><span id='cnt'></span>");bar.appendChild(pg);bar.appendChild(el("h2","","Our place"));bar.appendChild(el("span","pill","&nbsp;&nbsp;"));h.appendChild(bar);
 var cut=el("div","cut");var roof=el("div","roof");var at=el("button","attic",'<img src="'+I("locked")+'" alt="">');at.id="attic";roof.appendChild(at);cut.appendChild(roof);

  c.appendChild(meter(r.objs.length,count(r)));c.onclick=function(){enter(r,c)};cells[r.id]=c;fl.appendChild(c)});
 cut.appendChild(fl);sprite=el("div","sprite",'<img src="'+I("people-hugging")+'" alt="">');cut.appendChild(sprite);h.appendChild(cut);
 at.onclick=function(){if(count()>=NEED||/preview/.test(q))openLetter();else note("The attic is locked. Find "+(NEED-count())+" more little things around the house.")};
 refreshHub()}
function refreshHub(){var n=count(),a=$("#attic");$("#cnt").textContent=n+" / "+TOTAL+" found";var ok=n>=NEED||/preview/.test(q);a.classList.toggle("ready",ok);a.firstChild.src=I(ok?"love-letter":"locked");a.setAttribute("aria-label",ok?"Open the attic letter":"Attic, locked");
 ROOMS.forEach(function(r){var c=cells[r.id];c.classList.toggle("seen",!!seen[r.id]);c.querySelector(".meter").replaceWith(meter(r.objs.length,count(r)))})}
function place(c,instant){if(!c||!sprite)return;var cut=c.parentNode.parentNode;var x=c.offsetLeft+c.offsetWidth/2,y=c.offsetTop+c.offsetHeight+$(".roof",cut).offsetHeight-8;
 if(instant){sprite.style.transition="none"}sprite.style.left=x+"px";sprite.style.top=y+"px";if(instant)setTimeout(function(){sprite.style.transition=""},50)}

/* ---- rooms ---- */
function enter(r,c){var near=sprite.style.left===(c.offsetLeft+c.offsetWidth/2)+"px";place(c);setTimeout(function(){curRoom=r;seen[r.id]=1;save();buildRoom(r);var b=c.getBoundingClientRect();$("#roomS").style.transformOrigin=(b.left+b.width/2)+"px "+(b.top+b.height/2)+"px";show("roomS")},near?60:760)}
function buildRoom(r){var S=$("#roomS");S.innerHTML="";var port=innerWidth/innerHeight<1;var fy=port?(r.dark?54:57):(r.dark?62:66);
 var a=el("div","area");a.style.background=r.wall;
 var fl=el("div","");fl.style.cssText="position:absolute;left:0;right:0;bottom:0;top:calc(56px + (100% - 56px)*"+fy/100+");background:"+r.floor+";border-top:8px solid #0002";a.appendChild(fl);
 if(r.dark)stars(a,50);
 var bar=el("div","bar"+(r.dark?"":" lt"));var back=el("button","pill","&larr; House");back.onclick=function(){show("hub");refreshHub();place(cells[r.id],true)};
 bar.appendChild(back);var t=el("h2","",r.name);bar.appendChild(t);var pg=el("span","pill");pg.appendChild(meter(r.objs.length,count(r)));bar.appendChild(pg);
 var st=el("div","stage");
 function put(e,x,y,s){e.style.cssText+=";--x:"+x+"%;--y:"+y+"%;--s:"+s}
 r.deco.forEach(function(d){if(!d[3])return;var e=el("div","o d");e.innerHTML='<img src="'+I(d[0])+'" alt="">';put(e,d[1],d[2],d[3]);st.appendChild(e)});
 r.objs.forEach(function(o){var id=o[0],ic=o[1],sh=o[6];var b=el("button","o");b.type="button";b.setAttribute("aria-label",ic.replace(/-/g," "));
  if(sh==="shelf"){var s=el("div","shelf");s.style.cssText="left:"+o[2]+"%;top:"+o[3]+"%;width:"+(o[4]*1.8)+"cqmin";st.appendChild(s)}
  if(ic==="photo"){b.classList.add("photo");b.innerHTML='<img src="photos/photo-'+o[5]+'.jpg" alt="Photo '+o[5]+'">';b.style.setProperty("--r",(o[5]%2?-3:3)+"deg")}
  else b.innerHTML='<img src="'+I(ic)+'" alt="">';
  if(!found[id])b.insertAdjacentHTML("beforeend",'<img class="sp" src="'+I("sparkles")+'" alt="">');
  if(id==="comet"){b.style.display="none";setTimeout(function fly(){if(curRoom!==r||found.comet)return;b.style.display="";b.animate([{left:"100%",top:"10%"},{left:"-5%",top:"45%"}],{duration:7000}).onfinish=function(){b.style.display="none";setTimeout(fly,6000)}},3500)}
  put(b,o[2],o[3],o[4]);
  b.onclick=function(ev){var x=ev.clientX||innerWidth/2,y=ev.clientY||innerHeight/2;burst(x,y);
   if(ic==="photo"){photo(o[5]);mark(id,b);return}
   if(sh==="lamp")a.querySelector(".dark").classList.toggle("on");
   if(sh==="jar"){hearts=Math.min(hearts+1,9);var j=b.querySelector(".fill")||b.appendChild(el("div","fill"));j.style.cssText="position:absolute;left:25%;right:25%;bottom:12%;display:flex;flex-wrap:wrap;gap:1px;justify-content:center";j.innerHTML=Array(hearts+1).join('<img src="'+I("red-heart")+'" style="width:30%" alt="">');
    note(hearts>=6?"Full jar. We made up again.":"A heart for every time we made up.",hearts+" in the jar")}
   else{var lines=o[5];var n=tapped[id]=(tapped[id]||0)+1;note(lines[(n-1)%lines.length],lines.length>1?"tap again for more":"")}
   mark(id,b)};
  st.appendChild(b)});
 var dk=el("div","dark");a.appendChild(dk);a.appendChild(bar);a.appendChild(st);S.appendChild(a)}
function mark(id,b){if(found[id])return;found[id]=1;save();var s=b.querySelector(".sp");if(s)s.remove();var r=curRoom;$("#roomS .meter").replaceWith(meter(r.objs.length,count(r)));
 if(count()===NEED)setTimeout(function(){note("Something clicked upstairs. The attic is open.")},1400)}

/* ---- letter ---- */
function openLetter(){var l=$("#letter");l.innerHTML="";stars(l,40);var b=el("div","bar");var back=el("button","pill","&larr; House");back.onclick=function(){show("hub")};b.appendChild(back);l.appendChild(b);
 var p=el("div","paper");p.innerHTML=LETTER.map(function(t,i){return"<p"+(i>=LETTER.length-2?" class='sig'":"")+">"+t+"</p>"}).join("")+'<img src="'+I("heart-with-ribbon")+'" style="width:70px;margin:0 auto;animation:pulse 1.6s infinite" alt="">';
 l.appendChild(p);show("letter");p.scrollTop=0;setTimeout(function(){for(var i=0;i<8;i++)setTimeout(burst,i*220,innerWidth/2+(Math.random()*200-100),innerHeight*.6)},700)}

/* ---- note jar ---- */
var order=[],oi=0;$("#jar").onclick=function(e){if(oi>=order.length){order=POOL.map(function(_,i){return i}).sort(function(){return Math.random()-.5});oi=0}note(POOL[order[oi++]],"from the jar");burst(e.clientX||innerWidth-40,e.clientY||innerHeight-40)};

buildHub();show("ext");
})();
</script>
</body>
