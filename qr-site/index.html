<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f2ee">
  <title>Divij Shah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="lamp-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="lamp" aria-hidden="true">
      <span class="lamp-mount"></span>
      <span class="lamp-wire"></span>
      <span class="lamp-shade"></span>
      <span class="lamp-bulb"></span>
    </span>
  </button>

  <main>
    <header class="hero">
      <h1>DIVIJ SHAH</h1>
      <p class="intro">Law student based in Bombay</p>
    </header>

    <section class="qr-card" aria-label="Page status">
      <div class="qr-content">
        <img src="construction.svg" alt="">
        <h2>UNDER CONSTRUCTION</h2>
      </div>
    </section>

    <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.0.15</span>
      </span>
    </footer>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.querySelector(".lamp-switch");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const initial = saved === "dark" || saved === "light" ? saved : (systemTheme.matches ? "dark" : "light");

      const applyTheme = (theme, persist = true) => {
        root.dataset.theme = theme;
        toggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
        toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        themeMeta.setAttribute("content", theme === "dark" ? "#151513" : "#f3f2ee");
        if (persist) {
          saved = theme;
          try { localStorage.setItem("theme", theme); } catch (e) {}
        }
      };

      applyTheme(initial, false);

      systemTheme.addEventListener("change", (event) => {
        if (!saved) applyTheme(event.matches ? "dark" : "light", false);
      });

      toggle.addEventListener("click", () => {
        toggle.classList.remove("activating");
        void toggle.offsetWidth;
        toggle.classList.add("activating");
        window.setTimeout(() => {
          applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
          toggle.classList.remove("activating");
        }, 170);
      });
    })();
  </script>
</body>
</html>
