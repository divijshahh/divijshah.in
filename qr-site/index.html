<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divij Shah — personal landing page.">
  <meta name="author" content="Divij Shah">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#f3f2ee">
  <meta name="color-scheme" content="light dark">
  <link id="favicon" rel="icon" href="assets/favicon-light.svg?v=1.0.2" data-light-src="assets/favicon-light.svg?v=1.0.2" data-dark-src="assets/favicon-dark.svg?v=1.0.2" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Divij Shah</title>
</head>
<body>
  <button class="lamp-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="lamp" aria-hidden="true">
      <span class="lamp-mount"></span>
      <span class="lamp-wire"></span>
      <span class="lamp-shade"></span>
      <span class="lamp-bulb"></span>
    </span>
  </button>

  <main>
    <header class="hero">
      <h1>DIVIJ SHAH</h1>
      <p class="intro">Personal landing page</p>
    </header>

    <div class="qr-mark" aria-hidden="true">
      <img src="assets/qr-mark.svg?v=1.0.2" alt="">
    </div>

    <section class="qr-content" aria-labelledby="construction-title">
      <div class="qr-card">
        <div class="qr-card-content">
          <p class="label">QR LANDING PAGE</p>
          <h2 id="construction-title">UNDER CONSTRUCTION</h2>
          <p>This page will be used as the landing page for my business card.</p>
        </div>
      </div>
    </section>

    <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.0.2</span>
      </span>
    </footer>
  </main>

  <script src="assets/theme.js"></script>
</body>
</html>
