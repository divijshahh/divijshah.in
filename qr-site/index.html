<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f2ee">
  <link id="favicon" rel="icon" href="../assets/favicon-light.svg?v=v1.2.0" data-light-src="../assets/favicon-light.svg?v=v1.2.0" data-dark-src="../assets/favicon-dark.svg?v=v1.2.0" type="image/svg+xml">
  <title>Divij Shah</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="qr-page">
  <button class="lamp-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="lamp" aria-hidden="true">
      <span class="lamp-mount"></span>
      <span class="lamp-wire"></span>
      <span class="lamp-shade"></span>
      <span class="lamp-bulb"></span>
    </span>
  </button>

  <main>
    <header class="hero">
      <h1>DIVIJ SHAH</h1>
      <p class="intro">Law student based in Bombay</p>
    </header>

    <section class="qr-card" aria-label="Page status">
      <div class="qr-content">
        <img src="construction.svg" alt="">
        <h2>UNDER CONSTRUCTION</h2>
      </div>
    </section>

    <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.2.0</span>
      </span>
    </footer>
  </main>

  <script src="../assets/site.js"></script>
</body>
</html>
