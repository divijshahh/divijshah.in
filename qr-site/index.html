<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f2ee">
  <title>Divij Shah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-lab" aria-label="Theme control concepts">
    <button class="theme-option pull-switch" type="button" data-control="1" aria-label="Concept 1: wall mounted pull switch">
      <span class="option-number">1</span>
      <span class="wall-plate" aria-hidden="true">
        <span class="plate-screw plate-screw-top"></span>
        <span class="plate-screw plate-screw-bottom"></span>
      </span>
      <span class="pull-cord" aria-hidden="true">
        <span class="cord"></span>
        <span class="cord-knob"></span>
      </span>
      <span class="option-label">PULL</span>
    </button>

    <button class="theme-option lamp-switch" type="button" data-control="2" aria-label="Concept 2: tiny ceiling lamp">
      <span class="option-number">2</span>
      <span class="lamp" aria-hidden="true">
        <span class="lamp-mount"></span>
        <span class="lamp-wire"></span>
        <span class="lamp-shade"></span>
        <span class="lamp-bulb"></span>
      </span>
      <span class="option-label">LAMP</span>
    </button>

    <button class="theme-option rocker-switch" type="button" data-control="3" aria-label="Concept 3: wall rocker switch">
      <span class="option-number">3</span>
      <span class="rocker-plate" aria-hidden="true">
        <span class="rocker"></span>
      </span>
      <span class="option-label">ROCKER</span>
    </button>

    <button class="theme-option dial-switch" type="button" data-control="4" aria-label="Concept 4: rotary dimmer">
      <span class="option-number">4</span>
      <span class="dial-plate" aria-hidden="true">
        <span class="dial"></span>
        <span class="dial-mark"></span>
      </span>
      <span class="option-label">DIAL</span>
    </button>

    <button class="theme-option slider-switch" type="button" data-control="5" aria-label="Concept 5: sliding switch">
      <span class="option-number">5</span>
      <span class="slider-track" aria-hidden="true">
        <span class="slider-thumb"></span>
      </span>
      <span class="option-label">SLIDER</span>
    </button>
  </div>

  <main>
    <header class="hero">
      <h1>DIVIJ SHAH</h1>
      <p class="intro">Law student based in Bombay</p>
    </header>

    <section class="qr-card" aria-label="Page status">
      <div class="qr-content">
        <img src="construction.svg" alt="">
        <h2>UNDER CONSTRUCTION</h2>
      </div>
    </section>

    <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.0.14</span>
      </span>
    </footer>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const controls = [...document.querySelectorAll(".theme-option")];
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const initial = saved === "dark" || saved === "light" ? saved : (systemTheme.matches ? "dark" : "light");

      const applyTheme = (theme, persist = true) => {
        root.dataset.theme = theme;
        controls.forEach((control) => {
          control.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
        });
        themeMeta.setAttribute("content", theme === "dark" ? "#151513" : "#f3f2ee");
        if (persist) {
          saved = theme;
          try { localStorage.setItem("theme", theme); } catch (e) {}
        }
      };

      applyTheme(initial, false);

      systemTheme.addEventListener("change", (event) => {
        if (!saved) applyTheme(event.matches ? "dark" : "light", false);
      });

      controls.forEach((control) => {
        control.addEventListener("click", () => {
          control.classList.remove("activating");
          void control.offsetWidth;
          control.classList.add("activating");
          window.setTimeout(() => {
            applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
            control.classList.remove("activating");
          }, 170);
        });
      });
    })();
  </script>
</body>
</html>
