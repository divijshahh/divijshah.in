<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divij Shah QR page.">
  <meta name="author" content="Divij Shah">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#f3f2ee">
  <meta name="color-scheme" content="light dark">
  <link id="favicon" rel="icon" href="assets/favicon-light.svg?v=1.0.0" data-light-src="assets/favicon-light.svg?v=1.0.0" data-dark-src="assets/favicon-dark.svg?v=1.0.0" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Divij Shah</title>
</head>
<body>
  <button class="lamp-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="lamp" aria-hidden="true">
      <span class="lamp-mount"></span>
      <span class="lamp-wire"></span>
      <span class="lamp-shade"></span>
      <span class="lamp-bulb"></span>
    </span>
  </button>

  <main>
    <section class="qr-page" aria-labelledby="qr-title">
      <div class="identity">
        <p class="label">DIVIJ SHAH</p>
        <h1 id="qr-title">QR</h1>
      </div>

      <div class="qr-placeholder" aria-label="QR code area">
        <span>QR CODE</span>
      </div>

      <p class="instruction">Scan to connect</p>
    </section>

    <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.0.0</span>
      </span>
    </footer>
  </main>

  <script src="assets/theme.js"></script>
</body>
</html>
