</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
  </button>
  <main>
    <header>
      <div class="hero">
        <h1><a class="site-title-link" href="/">DIVIJ SHAH</a></h1>
        <p class="intro">Law student based in Bombay</p>
      </div>
    </header>

    <section class="site-content">
      <h2 class="page-heading">ABOUT</h2>
      <p class="page-lead">test abc xyz</p>
    </section>   <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v0.5.6</span>
      </span>
    </footer>

    <nav class="bottom-dock" aria-label="Site navigation">
      <a class="dock-item" href="/" aria-label="Home">
        <img class="dock-icon dock-home-icon" src="../assets/favicon-light.svg" data-light-src="../assets/favicon-light.svg" data-dark-src="../assets/favicon-dark.svg" alt="" aria-hidden="true">
        <span class="dock-label">HOME</span>
      </a>
      <a class="dock-item" href="/about" aria-label="About">
        <svg class="dock-icon dock-about-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 20c.6-3.7 2.9-5.75 6.5-5.75s5.9 2.05 6.5 5.75"/></svg>
        <span class="dock-label">ABOUT</span>
      </a>
      <a class="dock-item" href="/cv" aria-label="CV">
        <img class="dock-icon dock-cv-icon" src="https://www.svgrepo.com/show/533447/square-cv.svg" alt="" aria-hidden="true">
        <span class="dock-label">CV</span>
      </a>
    </nav>
  </main>
    <script>
    (() => {
      const path = window.location.pathname.replace(/\\/+$/, "") || "/";
      const links = document.querySelectorAll(".bottom-dock .dock-item");
      links.forEach((link) => {
        const target = new URL(link.href, window.location.origin).pathname.replace(/\\/+$/, "") || "/";
        if (target === path) link.setAttribute("aria-current", "page");
      });
    })();
  </script>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.querySelector(".theme-toggle");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const favicon = document.getElementById("favicon");
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      const moon = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
      const sun = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      let initial = saved === "dark" || saved === "light" ? saved : (systemTheme.matches ? "dark" : "light");
      const applyTheme = (theme, persist = true) => {
        root.dataset.theme = theme;
        toggle.innerHTML = theme === "dark" ? sun : moon;
        toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        toggle.setAttribute("title", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        themeMeta.setAttribute("content", theme === "dark" ? "#151513" : "#f3f2ee");
        document.querySelectorAll(".dock-home-icon").forEach((icon) => {
        icon.setAttribute("src", theme === "dark" ? icon.dataset.darkSrc : icon.dataset.lightSrc);
      });
      favicon.setAttribute("href", theme === "dark" ? "../assets/favicon-dark.svg?v=v0.5.6" : "../assets/favicon-light.svg?v=v0.5.6");
        if (persist) try { localStorage.setItem("theme", theme); } catch (e) {}
      };
      applyTheme(initial, false);
      systemTheme.addEventListener("change", event => { if (!saved) applyTheme(event.matches ? "dark" : "light", false); });
      toggle.addEventListener("click", () => { saved = root.dataset.theme === "dark" ? "light" : "dark"; applyTheme(saved); });
    })();
  </script>
</body>
</html>
