  <meta name="theme-color" content="#f3f2ee">

  <title>CV — Divij Shah</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "CV — Divij Shah",
    "url": "https://divijshah.in/cv",
    "description": "Curriculum vitae of Divij Shah.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Divij Shah",
      "url": "https://divijshah.in/"
    }
  }
  </script>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="cv-page">
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
  </button>
  <main>
    <header>
      <div class="hero">
        <h1><a class="site-title-link" href="/">DIVIJ SHAH</a></h1>
        <p class="intro">Law student based in Bombay</p>
      </div>
    </header>

    <section class="site-content">
      <h2 class="page-heading">CV</h2>
      <div class="cv-actions">
        <a class="cv-action" href="../cv.pdf" download>Download PDF ↓</a>
      </div>
      <div class="cv-viewer" id="cv-viewer" aria-label="Curriculum vitae">
        <div class="cv-loading" id="cv-loading">Loading CV…</div>
      </div>
    </section>   <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.0.10</span>
      </span>
    </footer>

    <nav class="bottom-dock" aria-label="Site navigation">
      <a class="dock-item" href="/" aria-label="Home">
        <img class="dock-icon dock-home-icon" src="../assets/favicon-light.svg" data-light-src="../assets/favicon-light.svg" data-dark-src="../assets/favicon-dark.svg" alt="" aria-hidden="true">
        <span class="dock-label">HOME</span>
      </a>
      <a class="dock-item" href="/cv" aria-label="CV">
        <svg class="dock-icon dock-cv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.25 2.75h8.5L18.75 6.75v14.5H6.25z"/><path d="M14.75 2.75v4h4M9 11h7M9 14h7M9 17h5"/></svg>
        <span class="dock-label">CV</span>
      </a>
    </nav>
  </main>
    <script>
    (() => {
      const path = window.location.pathname.replace(/\/+$/, "") || "/";
      const links = document.querySelectorAll(".bottom-dock .dock-item");
      links.forEach((link) => {
        const target = new URL(link.href, window.location.origin).pathname.replace(/\/+$/, "") || "/";
        if (target === path) link.setAttribute("aria-current", "page");
      });
    })();
  </script>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    const root = document.documentElement;
    const toggle = document.querySelector(".theme-toggle");
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const favicon = document.getElementById("favicon");
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    const moon = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
    const sun = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';

    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    let initial = saved === "dark" || saved === "light" ? saved : (systemTheme.matches ? "dark" : "light");

    const applyTheme = (theme, persist = true) => {
      root.dataset.theme = theme;
      toggle.innerHTML = theme === "dark" ? sun : moon;
      toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      toggle.setAttribute("title", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      themeMeta.setAttribute("content", theme === "dark" ? "#151513" : "#f3f2ee");
      document.querySelectorAll(".dock-home-icon").forEach((icon) => {
        icon.setAttribute("src", theme === "dark" ? icon.dataset.darkSrc : icon.dataset.lightSrc);
      });
      favicon.setAttribute("href", theme === "dark" ? "../assets/favicon-dark.svg?v=v1.0.10" : "../assets/favicon-light.svg?v=v1.0.10");
      if (persist) try { localStorage.setItem("theme", theme); } catch (e) {}
    };

    applyTheme(initial, false);
    systemTheme.addEventListener("change", event => { if (!saved) applyTheme(event.matches ? "dark" : "light", false); });
    toggle.addEventListener("click", () => { saved = root.dataset.theme === "dark" ? "light" : "dark"; applyTheme(saved); });

    const viewer = document.getElementById("cv-viewer");
    const loading = document.getElementById("cv-loading");

    const renderCv = async () => {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
        const pdf = await pdfjsLib.getDocument("../cv.pdf").promise;
        loading.remove();

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const baseViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.max(viewer.clientWidth - 40, 280);
          const scale = availableWidth / baseViewport.width;
          const viewport = page.getViewport({ scale });
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          const frame = document.createElement("div");
          frame.className = "cv-page-frame";

          const canvas = document.createElement("canvas");
          canvas.className = "cv-page-canvas";
          canvas.width = Math.ceil(viewport.width * dpr);
          canvas.height = Math.ceil(viewport.height * dpr);
          canvas.style.width = "100%";
          canvas.style.height = "auto";
          frame.appendChild(canvas);
          viewer.appendChild(frame);

          const context = canvas.getContext("2d", { alpha: false });
          await page.render({
            canvasContext: context,
            viewport,
            transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
          }).promise;
        }
      } catch (error) {
        console.error("Unable to render CV:", error);
        loading.textContent = "The CV could not be displayed here. Open the PDF instead.";
        loading.classList.add("cv-loading-error");
      }
    };

    renderCv();
  </script>
</body>
</html>
