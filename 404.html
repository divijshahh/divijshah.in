<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f2ee">
  <meta name="color-scheme" content="light dark">
  <link id="favicon" rel="icon" href="assets/favicon-light.svg?v=v1.2.1" data-light-src="assets/favicon-light.svg?v=v1.2.1" data-dark-src="assets/favicon-dark.svg?v=v1.2.1" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Page not found — Divij Shah</title>
</head>
<body class="error-page">
  <button class="lamp-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="lamp" aria-hidden="true">
      <span class="lamp-mount"></span>
      <span class="lamp-wire"></span>
      <span class="lamp-shade"></span>
      <span class="lamp-bulb"></span>
    </span>
  </button>

  <main>
    <section class="error-content" aria-labelledby="error-title">
      <p class="error-code">404</p>
      <h1 id="error-title">PAGE NOT FOUND</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a class="error-home" href="/">Back home</a>
    </section>

    <footer>
      <span>Bombay, India</span>
      <span class="footer-meta">
        <span>© 2026 Divij Shah</span>
        <span class="version">v1.2.1</span>
      </span>
    </footer>
  </main>

  <script src="assets/site.js"></script>
</body>
</html>
